title: "NP Blog"
title_separator: "|"
description: >-
  Hi there! I'm Nazarii Piontko, a software engineer who loves to solve problems with code.
  On my blog, I share my tech discoveries, research findings, and hands-on experiments.

name: "Nazarii Piontko"
copyright: "Nazarii Piontko"

author:
  name: "Nazarii Piontko"
  # avatar: "/assets/images/bio-photo.jpg"
  bio: >-
    Hi there! I'm Nazarii Piontko, a software engineer who loves to solve problems with code.
    On my blog, I share my tech discoveries, research findings, and hands-on experiments.
  location: "Poland"
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/nazarii-piontko"
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/piontko"
    - label: "Twitter/X"
      icon: "fab fa-fw fa-twitter"
      url: "https://x.com/leakyheap"
    - label: "Medium"
      icon: "fab fa-fw fa-medium"
      url: "https://medium.com/@npiontko"

github_username: nazarii-piontko
repository: "nazarii-piontko/blog"
twitter:
  username: '@elheap42'

locale: "en-US"
url: "https://www.npiontko.pro"

# logo: favicon.png

theme: minimal-mistakes-jekyll
minimal_mistakes_skin: "dark" # "air", "aqua", "contrast", "dark", "dirt", "neon", "mint", "plum", "sunrise
# theme: minima

# show_excerpts: true

defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      permalink: /:categories/:year/:month/:day/:title
      show_date: true
      read_time: true
      share: false
      comments: true

footer:
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/nazarii-piontko"
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/piontko"
    - label: "Twitter/X"
      icon: "fab fa-fw fa-twitter"
      url: "https://x.com/leakyheap"
    - label: "Medium"
      icon: "fab fa-fw fa-medium"
      url: "https://medium.com/@npiontko"

comments:
  provider: giscus
  giscus:
    repo_id: "R_kgDOK0yjEg"
    category_name: "General"
    category_id: "DIC_kwDOK0yjEs4C2lS8"
    discussion_term: "pathname"
    strict: "0"
    reactions_enabled: "1"
    emit_metadata: "0"
    input_position: "top"
    theme: "dark_dimmed"
    lang: "en"
    lazy: true

exclude:
  - Dockerfile
  - jekyll-image-build.sh
  - jekyll.sh

plugins:
  - jekyll-minifier
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-include-cache

jekyll-minifier:
  uglifier_args:
    harmony: true
  exclude: 'robots.txt'
