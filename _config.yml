title: "NP Blog"
title_separator: "|"
description: >-
  Hi there! I'm Nazarii Piontko, a software engineer who loves to solve problems with code.
  On this blog, I share my thoughts and experiences about making software.

name: "Nazarii Piontko"
copyright: "Nazarii Piontko"

author:
  name: "Nazarii Piontko"
  # avatar: "/assets/images/bio-photo.jpg"
  bio: >-
    Hi there! I'm Nazarii Piontko, a software engineer who loves to solve problems with code.
    On this blog, I share my thoughts and experiences about making software.
  location: "Poland"
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/nazarii-piontko"
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/piontko"
    - label: "Twitter/X"
      icon: "fab fa-fw fa-twitter"
      url: "https://x.com/elheap42"
    - label: "Medium"
      icon: "fab fa-fw fa-medium"
      url: "https://medium.com/@npiontko"

github_username: nazarii-piontko
twitter:
  username: '@elheap42'

locale: "en-US"
url: "https://www.npiontko.pro"

# logo: favicon.png

theme: minimal-mistakes-jekyll
minimal_mistakes_skin: "dark" # "air", "aqua", "contrast", "dark", "dirt", "neon", "mint", "plum", "sunrise
# theme: minima

# show_excerpts: true

defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      permalink: /:categories/:year/:month/:day/:title
      show_date: true
      read_time: true
      share: false
      comments: true

footer:
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/nazarii-piontko"
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/piontko"
    - label: "Medium"
      icon: "fab fa-fw fa-medium"
      url: "https://medium.com/@npiontko"

analytics:
  provider: "google-gtag"
  google:
    tracking_id: "GTM-T286SJGR"

comments:
  provider: disqus
  disqus:
    shortname: np-blog-1

exclude:
  - Dockerfile
  - jekyll-image-build.sh
  - jekyll.sh

plugins:
  - jekyll-minifier
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-include-cache

jekyll-minifier:
  uglifier_args:
    harmony: true

after_footer_scripts:
  - https://cdn.jsdelivr.net/npm/cookieconsent@3/build/cookieconsent.min.js
  - /assets/js/cookie-consent.js?version=1724706109
