<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Roboto');
      .box { fill: dimgray; stroke: black; stroke-width: 1; }
      text { font-family: 'Roboto', Arial, sans-serif; font-size: 12pt; fill: white; text-anchor: middle; dominant-baseline: middle; }
      line { stroke: dimgray; stroke-width: 1; }
    </style>
  </defs>

  <g id="diagram">
    <!-- Row 1 -->
    <g transform="translate(0, 0)">
      <g transform="translate(100, 0)">
        <rect width="100" height="40" class="box"/>
        <text x="50" y="20">Features</text>
      </g>
      <g transform="translate(400, 0)">
        <rect width="100" height="40" class="box"/>
        <text x="50" y="20">Steps</text>
      </g>
      <line x1="0" y1="60" x2="600" y2="60" />
    </g>

    <!-- Row 2 -->
    <g transform="translate(0, 80)">
      <g transform="translate(100, 0)">
        <rect width="100" height="40" class="box"/>
        <text x="50" y="20">Page Objects</text>
      </g>
      <g transform="translate(400, 0)">
        <rect width="100" height="40" class="box"/>
        <text x="50" y="20">Asserts</text>
      </g>
      <line x1="0" y1="60" x2="600" y2="60" />
    </g>

    <!-- Row 3 -->
    <g transform="translate(0, 160)">
      <g transform="translate(20, 0)">
        <rect width="100" height="40" class="box"/>
        <text x="50" y="20">Config</text>
      </g>
      <g transform="translate(140, 0)">
        <rect width="100" height="40" class="box"/>
        <text x="50" y="15">App</text>
        <text x="50" y="30">Controller</text>
      </g>
      <g transform="translate(260, 0)">
        <rect width="100" height="40" class="box"/>
        <text x="50" y="15">Web Driver</text>
        <text x="50" y="30">Factory</text>
      </g>
      <g transform="translate(380, 0)">
        <rect width="100" height="40" class="box"/>
        <text x="50" y="15">Service</text>
        <text x="50" y="30">Locator</text>
      </g>
      <g transform="translate(500, 0)">
        <rect width="80" height="40" class="box"/>
        <text x="40" y="20">Utils</text>
      </g>
      <line x1="0" y1="60" x2="600" y2="60" />
    </g>

    <!-- Row 4 -->
    <g transform="translate(0, 240)">
      <g transform="translate(20, 0)">
        <rect width="100" height="40" class="box"/>
        <text x="50" y="20">Python</text>
      </g>
      <g transform="translate(140, 0)">
        <rect width="100" height="40" class="box"/>
        <text x="50" y="20">Behave</text>
      </g>
      <g transform="translate(260, 0)">
        <rect width="100" height="40" class="box"/>
        <text x="50" y="20">Selenium</text>
      </g>
      <g transform="translate(380, 0)">
        <rect width="100" height="40" class="box"/>
        <text x="50" y="20">Docker</text>
      </g>
      <g transform="translate(500, 0)">
        <rect width="80" height="40" class="box"/>
        <text x="40" y="20">...</text>
      </g>
    </g>
  </g>
</svg>
